/* Layout: one centered study column — header, set filter, then a big index card (flashcards) or a question card (quiz). Teacher settings swap in as a full panel with a checkbox grid. Set colors echo the class reference cards: prefix pink, suffix blue, Latin lavender, Greek green. */
:root{
  --bg:#ECEFF4; --card:#FFFFFF; --ink:#1B2433; --muted:#5B6678; --line:#CBD2DE;
  --hi:#FFD24A; --hi-ink:#1B2433; --primary:#3A4E8C; --primary-ink:#FFFFFF;
  --prefix:#F4AFBF; --suffix:#A3BEEA; --latin:#C9B5F0; --greek:#A9DDB5;
  --good:#1E8A4C; --good-bg:#E2F5E9; --bad:#C2372E; --bad-bg:#FCE7E5;
  --paper:#F4F5EE; --paper-ink:#3A3D44; --rule:#A7A9AB;
  --display:"URW Gothic", "Century Gothic", CenturyGothic, "Avenir Next", sans-serif;
  --body:"URW Gothic", "Century Gothic", CenturyGothic, "Avenir Next", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#262B35; --paper-ink:#E6E8EC; --rule:#5D636E; --bg:#12161F; --card:#1C2230; --ink:#E7EBF2; --muted:#9AA4B6; --line:#2F3747;
  --hi:#E8B730; --hi-ink:#12161F; --primary:#8FA6F0; --primary-ink:#10141C;
  --prefix:#7A3B50; --suffix:#2E4C80; --latin:#563F88; --greek:#2D6141;
  --good:#5FD38F; --good-bg:#16352A; --bad:#FF8A80; --bad-bg:#3A1E1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#262B35; --paper-ink:#E6E8EC; --rule:#5D636E; --bg:#12161F; --card:#1C2230; --ink:#E7EBF2; --muted:#9AA4B6; --line:#2F3747;
  --hi:#E8B730; --hi-ink:#12161F; --primary:#8FA6F0; --primary-ink:#10141C;
  --prefix:#7A3B50; --suffix:#2E4C80; --latin:#563F88; --greek:#2D6141;
  --good:#5FD38F; --good-bg:#16352A; --bad:#FF8A80; --bad-bg:#3A1E1D; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
header > div{min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.1;margin:0;text-wrap:balance}
.titlebtn{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.titlebtn:focus-visible{outline:3px solid var(--primary);outline-offset:4px;border-radius:6px}
.devtag{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1 mark{background:linear-gradient(transparent 55%, var(--hi) 55%);color:inherit;padding:0 2px}
h2{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.15;margin:0}
.sub{color:var(--muted);margin:0;font-size:.98rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.tabs button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink)}
/* Mode tabs: one scrolling row of icon tiles */
.modetabs{flex:1 1 100%;min-width:0;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;position:relative;gap:2px;border-radius:18px;padding:5px;scroll-padding-inline:8px}
.modetabs::-webkit-scrollbar{display:none}
.modetabs.fl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.modetabs.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.modetabs.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.modetabs button{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:74px;min-height:64px;padding:8px 10px 7px;border-radius:13px;font-size:.8rem;font-weight:700;line-height:1.1;white-space:nowrap;color:var(--muted);transition:background .15s,color .15s,transform .15s}
.modetabs button:hover{color:var(--ink);background:var(--bg)}
.modetabs button:active{transform:scale(.95)}
.modetabs button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink)}
.modetabs button:focus-visible{outline-offset:-3px}
.ti{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modetabs button[aria-selected="true"] .ti{stroke-width:2.3}
.modetabs button:not([aria-selected="true"]):nth-child(4n+1) .ti{color:color-mix(in srgb,var(--ink) 40%,#D6336C)}
.modetabs button:not([aria-selected="true"]):nth-child(4n+2) .ti{color:color-mix(in srgb,var(--ink) 40%,#2F6FD6)}
.modetabs button:not([aria-selected="true"]):nth-child(4n+3) .ti{color:color-mix(in srgb,var(--ink) 40%,#7048E8)}
.modetabs button:not([aria-selected="true"]):nth-child(4n+4) .ti{color:color-mix(in srgb,var(--ink) 40%,#2B9348)}
.filter{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;min-height:44px;font-size:.92rem;font-weight:600;color:var(--muted)}
.filter button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:800}

.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:6px;color:var(--ink)}
.k-prefix{background:var(--prefix)} .k-suffix{background:var(--suffix)} .k-latin{background:var(--latin)} .k-greek{background:var(--greek)}

/* Flashcard — modeled on the printed IMSE cards: category band, meaning header, T-chart, number tab */
.scene{perspective:1400px}
.flash{display:block;width:100%;border:0;background:none;padding:0;text-align:left;--fc:var(--suffix)}
.flash.cat-prefix{--fc:var(--prefix)} .flash.cat-suffix{--fc:var(--suffix)} .flash.cat-latin{--fc:var(--latin)} .flash.cat-greek{--fc:var(--greek)}
.inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:380px;background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.10),0 8px 22px rgba(0,0,0,.10);padding:0 clamp(14px,4vw,30px);display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;font-family:var(--body)}
.face.back{transform:rotateY(180deg)}
.band{margin:0 2%;background:var(--fc);color:var(--paper-ink);border-radius:0 0 18px 18px;text-align:center;font-weight:700;letter-spacing:.05em;font-size:1.2rem;padding:12px 10px 10px}
.heads{display:grid;gap:8px;text-align:center;padding:14px 0 10px;border-bottom:3px solid var(--rule)}
.heads b{display:block;font-size:clamp(1.05rem,3.6vw,1.45rem);line-height:1.2}
.heads i.form{font-style:normal;font-weight:700;margin-top:2px}
.heads i{display:block;font-size:clamp(.9rem,3vw,1.1rem);margin-top:4px}
.tchart{flex:1;display:grid;min-height:170px}
.tchart .col{display:flex;flex-direction:column;align-items:center;gap:.35em;padding:14px 6px 18px;font-size:clamp(1.05rem,4.2vw,1.55rem);min-width:0;overflow-wrap:anywhere;text-align:center}
.tchart .col + .col{border-left:3px solid var(--rule)}
.tchart mark{background:transparent;color:inherit;font-weight:700;padding:0;text-decoration:underline;text-decoration-color:var(--fc);text-decoration-thickness:4px;text-underline-offset:3px}
.foot{display:flex;justify-content:flex-end;margin-top:auto}
.tab{background:var(--fc);border-radius:16px 16px 0 0;padding:9px 26px;font-size:.85rem;letter-spacing:.03em;text-transform:uppercase}
.bigwrap{margin:auto 0;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:20px 0}
.big{font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.alts{font-size:1rem;opacity:.8}

const SETS={a:"Affixes",l:"Latin bases",g:"Greek bases"};
function expand(t){const m=t.match(/[\(\[](\w+)[\)\]]/);if(!m)return[t];return[...expand(t.replace(m[0],m[1])),...expand(t.replace(m[0],''))]}
const STOP=new Set("of to a the in be being that is way act who or and for which".split(" "));
let gi=0;
const BANK=RAW.trim().split("\n").map(line=>{
  const [set,num,label,meanF,wordsF,clue]=line.split("|");
  const senses=meanF.split("^").map(x=>{let [m,pos,form]=x.split("~");pos=(pos||"").trim();return{mean:m.trim(),form:(form||"").trim(),pos:pos?(pos.startsWith("!")?pos.slice(1):`(${pos})`):""}});
  let cols=wordsF.split(" / ").map(c=>c.split(",").map(w=>w.trim()).filter(Boolean));
  if(cols.length===1){const w=cols[0],h=Math.ceil(w.length/2);cols=[w.slice(0,h),w.slice(h)]}
  while(cols.length<senses.length)cols.push([]);
  const words=cols.flat(), mean=senses.map(x=>x.mean).join("; ");
  const kind=set==="l"?"latin":set==="g"?"greek":label.trim().startsWith("-")?"suffix":"prefix";
  const lst=label.includes(" (")?label.replace(/\s\(/g,", ").replace(/\)$/,""):label;
  const forms=[...new Set(lst.split(",").map(s=>s.trim().replace(/-/g,"")).filter(Boolean).flatMap(expand))].sort((x,y)=>y.length-x.length);
  const ci=clue.indexOf("=");
  const main=label.split(" (")[0];
  const alts=label.includes(" (")?label.slice(label.indexOf(" (")+2,-1):"";
  const id=set==="g"?"g"+(++gi):set+num;
  const toks=new Set(mean.toLowerCase().split(/[^a-z]+/).filter(w=>w&&!STOP.has(w)));
  return{id,set,num:+num,label,main,alts,kind,mean,senses,cols,words,forms,clue:[clue.slice(0,ci),clue.slice(ci+1)],toks};
});
const BYID=Object.fromEntries(BANK.map(c=>[c.id,c]));
/* 16-week semester plan: 14 teaching weeks + review weeks 8 and 16 */
const WEEKS=16, REVIEW=[8,16];
const PLAN=(()=>{
  const teach=[];for(let w=1;w<=WEEKS;w++)if(!REVIEW.includes(w))teach.push(w);
  const n=teach.length, wk={};teach.forEach(w=>wk[w]=[]);
  /* Greek lessons spread across the term; affixes and Latin bases fill the rest so each week has about the same number of cards */
  const gw={};teach.forEach(w=>gw[w]=0);
  const GL=Math.max(...BANK.filter(c=>c.set==='g').map(c=>c.num));for(let L=1;L<=GL;L++){const w=teach[Math.round((L-1)*(n-1)/(GL-1))];const ids=BANK.filter(c=>c.set==='g'&&c.num===L).map(c=>c.id);wk[w].push(...ids);gw[w]+=ids.length}
  const T=BANK.length/n, cap=teach.map(w=>Math.max(0,T-gw[w])), capSum=cap.reduce((a,b)=>a+b,0);
  const alloc=total=>{const raw=cap.map(c=>c*total/capSum),fl=raw.map(Math.floor);let left=total-fl.reduce((a,b)=>a+b,0);
    raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>fl[i]++);return fl};
  const fill=(list,counts)=>{let i=0;teach.forEach((w,k)=>{wk[w].unshift(...list.slice(i,i+counts[k]).map(c=>c.id));i+=counts[k]})};
  fill(BANK.filter(c=>c.set==='l'),alloc(43));fill(BANK.filter(c=>c.set==='a'),alloc(65));
  const out=[];let sofar=[];
  for(let w=1;w<=WEEKS;w++){
    if(REVIEW.includes(w))out.push({w,review:true,ids:sofar.slice()});
    else{out.push({w,review:false,ids:wk[w]});sofar=sofar.concat(wk[w])}}
  return out})();
const weekIds=(w,cum)=>{const ids=new Set();PLAN.filter(p=>cum?p.w<=w:p.w===w).forEach(p=>p.ids.forEach(i=>ids.add(i)));return[...ids]};
const KIND={prefix:"Prefix",suffix:"Suffix",latin:"Latin base",greek:"Greek base"};
const numLabel=c=>c.set==="g"?`Greek lesson ${c.num}`:`${SETS[c.set]} #${c.num}`;

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* Shuffle bags: each game deals items in a random order and uses every item once before any repeats.
   A new pool (teacher changes cards or week) starts a fresh bag; the first item of a new bag is never the last one dealt. */
const BAGS={};
function draw(key,list,n,keyOf){
  keyOf=keyOf||(x=>x.id);
  if(!list.length)return[];
  const sig=list.map(keyOf).join(',');
  let b=BAGS[key];if(!b||b.sig!==sig)b=BAGS[key]={sig,q:[],last:null};
  const out=[];
  while(out.length<n){
    if(!b.q.length){
      b.q=shuf(list).filter(x=>!out.includes(x)||out.length>=list.length);
      if(!b.q.length)b.q=shuf(list);
      if(b.q.length>1&&b.q[b.q.length-1]===b.last){const t=b.q[0];b.q[0]=b.q[b.q.length-1];b.q[b.q.length-1]=t}
    }
    const x=b.q.pop();b.last=x;out.push(x);
  }
  return out;
}
const overlap=(a,b)=>[...a.toks].some(t=>b.toks.has(t));

function hl(word,c){
  const lw=word.toLowerCase();
  for(const f of c.forms){
    let i=-1;
    if(c.kind==="prefix"){if(lw.startsWith(f))i=0}
    else if(c.kind==="suffix"){if(lw.endsWith(f))i=lw.length-f.length}
    else i=lw.indexOf(f);
    if(i>=0)return esc(word.slice(0,i))+'<mark>'+esc(word.slice(i,i+f.length))+'</mark>'+esc(word.slice(i+f.length));
  }
  return esc(word);
}

const QN=10; let Q=null;
function others(c,n,ok){return shuf(BANK.filter(x=>x!==c&&!overlap(x,c)&&ok(x))).slice(0,n)}
function makeQ(c){
  const t=Math.floor(Math.random()*3), rt=`<span class="r">${esc(c.main)}</span>`;
  if(t===0){const seen=new Set([c.mean]);const d=others(c,40,()=>true).filter(x=>!seen.has(x.mean)&&seen.add(x.mean)).slice(0,3);
    return{c,ty:'mean',prompt:`What does ${rt} mean?`,ans:c.mean,opts:shuf([c.mean,...d.map(x=>x.mean)])}}
  if(t===1){const seen=new Set([c.main]);const d=others(c,40,x=>x.kind===c.kind||Math.random()<.3).filter(x=>!seen.has(x.main)&&seen.add(x.main)).slice(0,3);
    const sm=c.senses[Math.floor(Math.random()*c.senses.length)].mean;
    return{c,ty:'part',prompt:`Which word part ${c.senses.length>1?"can mean":"means"} “${esc(sm)}”?`,ans:c.main,opts:shuf([c.main,...d.map(x=>x.main)])}}
  const d=others(c,3,x=>!c.forms.some(f=>x.clue[0].toLowerCase().includes(f))&&x.clue[0]!==c.clue[0]);
  return{c,ty:'word',prompt:`Which word means “${esc(c.clue[1])}”?`,ans:c.clue[0],opts:shuf([c.clue[0],...d.map(x=>x.clue[0])])}
}
function startQuiz(list,tag={}){

  const picks=draw(list&&list.length?'quizmissed':'quiz',src,QN);
  Q={qs:picks.slice(0,QN).map(makeQ),i:0,score:0,missed:[],tag};renderQ();
}
function renderQ(){
  const q=Q.qs[Q.i];

    ${(()=>{const w=[c.clue[0],...c.words].find(w=>MORPH[w.toLowerCase()]&&MORPH[w.toLowerCase()].length>1);return w?`<p style="margin:0">Here's how <b>${esc(w)}</b> is built:</p>${partsRow(w)}`:''})()}
    <div class="grp" style="justify-content:space-between"><button class="btn primary" id="qnext">${last?'See my score':'Next question →'}</button>${reportBtn({where:'Quiz',card:c.main,word:c.main})}</div></div>`;

function results(){

  $('qcard').innerHTML=`<div class="qtop"><span>Round complete</span><div class="track"><i style="width:100%"></i></div><span>Best: ${best} / ${QN}</span></div>

    ${Q.missed.length?`<div><p class="note" style="margin-bottom:8px">Cards to practice:</p><div class="chips">${Q.missed.map(c=>`<span><mark>${esc(c.main)}</mark> = ${esc(c.mean)}</span>`).join('')}</div></div>`:''}
    <div class="grp"><button class="btn primary" id="again">Play again</button>${Q.missed.length?'<button class="btn" id="studyMissed">Study missed cards</button><button class="btn" id="quizMissed">Quiz me on these</button>':''}</div>`;
  $('again').onclick=()=>Q.tag.check?startQuiz(BANK.filter(c=>weekIds(Q.tag.check,false).includes(c.id)),Q.tag):Q.tag.review?(setMode('review')):startQuiz();
  if(Q.missed.length){const m=Q.missed.slice();
    $('studyMissed').onclick=()=>{setMode('cards',true);deck=m;idx=0;renderCard()};
    $('quizMissed').onclick=()=>startQuiz(m)}
}

const WORDS=WRAW.trim().split("\n").map(l=>{const [w,segs,def]=l.split("|");

    if((m=t.match(/^([a-z]+)@(\w+)$/))){const card=BYID[m[2]];return{s:m[1],card,kind:card.kind}}
    if((m=t.match(/^([a-z]+)=(.+)$/)))return{s:m[1],gloss:m[2].replace(/_/g,' '),kind:'free'};
    return{s:t,kind:'free',silent:t==='e'}});
  return{w,parts,def}});
const PLABEL=p=>p.card?KIND[p.card.kind]:p.silent?'Silent e':p.gloss?'Other root':'Base word';
const PMEAN=p=>p.card?`means “${esc(p.card.mean)}”`:p.silent?'no sound of its own':p.gloss?`means “${esc(p.gloss)}”`:'a word on its own';
const PSHOW=p=>p.kind==='prefix'?p.s+'-':p.kind==='suffix'?'-'+p.s:p.s;
function wordPool(){const ids=new Set(pool().map(c=>c.id));return WORDS.filter(w=>w.parts.some(p=>p.card&&ids.has(p.card.id)))}
function poolOrAll(noteEl){let ws=wordPool();
  $(noteEl).textContent=ws.length?(selected||filter!=='all'?`${ws.length} word${ws.length===1?'':'s'} use the cards you're practicing.`:`${ws.length} practice words.`):"None of the practice words use the chosen cards yet, so all words are shown.";
  return ws.length?ws:WORDS}
const segHTML=w=>`<div class="segs" aria-label="${esc(w.w)}">${w.parts.map(p=>`<span class="seg c-${p.kind}">${esc(p.s)}</span>`).join('')}</div>`;
const eqHTML=w=>`<div class="eq">${w.parts.map(p=>`<span class="tag c-${p.kind}" style="background:var(--fc);color:var(--paper-ink);font-size:.95rem;letter-spacing:0;text-transform:none">${esc(PSHOW(p))}</span>`).join('<span class="op">+</span>')}<span class="op">=</span><b>${esc(w.w)}</b></div>`;

/* Build it */
let B=null, built=0, lastWord=null;
function newBuild(){
  const ws=poolOrAll('bnote');
  const w=draw('build',ws,1,x=>x.w)[0];
  lastWord=w;
  const have=new Set(w.parts.map(p=>p.s));
  const cands=shuf(WORDS.flatMap(x=>x.parts)).filter(p=>!p.silent&&!have.has(p.s)&&(have.add(p.s),true));
  const want=['prefix','suffix',null,null], extra=[];
  for(const k of want){const i=cands.findIndex(p=>k?p.kind===k:true);if(i>=0)extra.push(cands.splice(i,1)[0])}
  B={w,tiles:shuf([...w.parts,...extra]),picked:[],hint:0,solved:false,msg:''};
  renderBuild();
}
function renderBuild(){
  const w=B.w;
  const slot=B.picked.length?B.picked.map(i=>{const t=B.tiles[i];return`<button class="tile c-${t.kind}" data-un="${i}" aria-label="Remove ${esc(t.s)}" ${B.solved?'disabled':''}><b>${esc(t.s)}</b><small>${PLABEL(t)}</small></button>`}).join('')
    :`<span class="ph">Tap the parts below to build the word</span>`;
  const hint=B.hint?`Hint: ${w.parts.slice(0,B.hint).map(p=>esc(PSHOW(p))).join(' + ')}${B.hint<w.parts.length?' + …':''}`:`This word has ${w.parts.length} parts.`;
  $('bcard').innerHTML=`<p class="wlabel">Build a word that means</p>
    <div class="sayrow" style="justify-content:center"><p class="target">“${esc(w.def)}”</p>${sayBtn(w.def,"Listen to the meaning")}</div>
    <div class="slots ${B.solved?'ok':''}" id="slots">${slot}</div>
    ${B.solved?`${eqHTML(w)}<p class="bfb ok">You built it! ${built} word${built===1?'':'s'} built so far.</p>`
      :`<p class="hintline">${hint}</p>${B.msg?`<p class="bfb no">${B.msg}</p>`:''}
    <div class="tray">${B.tiles.map((t,i)=>`<button class="tile c-${t.kind}" data-i="${i}" ${B.picked.includes(i)?'disabled':''}><b>${esc(t.s)}</b><small>${PLABEL(t)}</small></button>`).join('')}</div>`}
    <div class="controls" style="justify-content:center">
      ${B.solved?`<button class="btn primary" id="bnext">Next word →</button>`
        :`<button class="btn primary" id="bcheck" ${B.picked.length?'':'disabled'}>Check</button>
          <button class="btn" id="bclear" ${B.picked.length?'':'disabled'}>Clear</button>
          <button class="btn" id="bhint" ${B.hint>=w.parts.length?'disabled':''}>Hint</button>
          <button class="btn" id="bskip">Show answer</button>`}
    </div>`;
  $('bcard').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{B.picked.push(+b.dataset.i);B.msg='';renderBuild()});
  $('bcard').querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{B.picked=B.picked.filter(i=>i!==+b.dataset.un);B.msg='';renderBuild()});
  if(B.solved){$('bnext').onclick=newBuild;$('bnext').focus();return}
  $('bcheck').onclick=()=>{
    const made=B.picked.map(i=>B.tiles[i].s).join('');
    if(made===w.w){rec(d=>{const o=sub(d,'build');bump(o,'n');if(B.hint)bump(o,'hints');w.parts.forEach(p=>{if(p.card)bump(sub(d,'right'),p.card.id)})});B.solved=true;built++;renderBuild();const sl=$('slots');FX.burst(sl,40);FX.cheer(sl,FX.praise(0));FX.play('good',2);sl.classList.add('popin')}
    else{B.msg=made.length<w.w.length&&w.w.startsWith(made)?`Good start! “${esc(made)}” needs more parts.`:`“${esc(made)}” isn't the word. Try a different part.`;
      renderBuild();const sl=$('slots');sl.classList.add('no','shake')}
  };
  $('bclear').onclick=()=>{B.picked=[];B.msg='';renderBuild()};
  $('bhint').onclick=()=>{B.hint++;renderBuild()};
  $('bskip').onclick=()=>{rec(d=>{bump(sub(d,'build'),'shown');w.parts.forEach(p=>{if(p.card)missCard(d,p.card.id)})});B.picked=w.parts.map(p=>B.tiles.indexOf(p));B.solved=true;B.msg='';renderBuild();
    $('bcard').querySelector('.bfb').textContent='Here is how it fits together. Try the next one!'};
}

/* ---------- Celebration effects: confetti, sounds, cheers ---------- */
const FX=(()=>{
  const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
  const reduce=()=>document.documentElement.classList.contains('calm')||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  let soundOn=store.get('rd-sound',true)!==false,ac=null;
  const COLORS=()=>{const cs=getComputedStyle(document.documentElement);return['--prefix','--suffix','--latin','--greek','--hi','--good','--primary'].map(v=>cs.getPropertyValue(v).trim()||'#ffd24a')};
  function size(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
  addEventListener('resize',size);size();
  function loop(){cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life>0);
    for(const p of parts){p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
      cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
      if(p.star){cx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5,r=k%2?p.s*.42:p.s;cx.lineTo(Math.sin(a)*r,-Math.cos(a)*r)}cx.closePath();cx.fill()}
      else if(p.round){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
    raf=parts.length?requestAnimationFrame(loop):0}
  function go(){if(!raf)raf=requestAnimationFrame(loop)}

    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*5;
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.5,g:.18,r:Math.random()*6,vr:(Math.random()-.5)*.4,s:5+Math.random()*6,c:cs[i%cs.length],life:55+Math.random()*25,round:Math.random()<.3,star:i%3===0})}go()}
  function burst(el,n){if(!el)return;const r=el.getBoundingClientRect?el.getBoundingClientRect():el;burstAt(r.left+r.width/2,r.top+r.height/2,n)}
  function shower(){if(reduce())return;const cs=COLORS();
    for(let i=0;i<160;i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cs[i%cs.length],life:160+Math.random()*80,round:Math.random()<.3,star:i%4===0});go()}
  function cheer(el,text){if(!el)return;const r=el.getBoundingClientRect?el.getBoundingClientRect():el;const d=document.createElement('div');d.className='floaty'+(/^\d+ in a row!$/.test(text)?' big':'');d.textContent=(/^\d+ in a row!$/.test(text)?'🔥 ':'')+text;
    d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
  function tone(f,t0,dur,type='sine',vol=.18){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,ac.currentTime+t0);g.gain.linearRampToValueAtTime(vol,ac.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t0+dur);
    o.connect(g).connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+dur+.05)}
  function play(kind,step=0){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const up=0; // same chime every time (no rising pitch)
    if(kind==='good'){tone(660+up,0,.14,'triangle');tone(990+up,.09,.22,'triangle')}
    else if(kind==='bad'){tone(220,0,.18,'sine',.12);tone(185,.1,.2,'sine',.1)}
    else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle'));tone(1319,.5,.5,'triangle',.14)}
    else if(kind==='flip'){tone(440,0,.06,'square',.04)}
  }catch(e){}}
  function setSound(on){soundOn=on;store.set('rd-sound',on);const b=$('soundBtn');b.textContent=on?'Sound on':'Sound off';b.setAttribute('aria-pressed',on)}
  $('soundBtn').onclick=()=>{setSound(!soundOn);if(soundOn)play('good')};setSound(soundOn);
  const PRAISE=['Match!','Nice!','You got it!','Root-tastic!','Great eye!','Super sleuth!','Case closed!','Brilliant!','Spot on!','Word wizard!','Clue cracked! 🔍','Mystery solved!','Sharp detective!','Elementary! 🕵️'];

const SPEAK=(()=>{const ok='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;let voice=null;
  function pick(){if(!ok)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en-US/i.test(v.lang)&&/samantha|google us|aria|jenny|zira|natural/i.test(v.name))||vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}

$('tsSeg').querySelectorAll('button').forEach(b=>{b.setAttribute('aria-label',['Normal','Large','Extra large'][[...b.parentNode.children].indexOf(b)]+' text');b.onclick=()=>{DISP.ts=b.dataset.ts;applyDisp()}});
$('optEasy').onchange=e=>{DISP.easy=e.target.checked;applyDisp()};$('optCalm').onchange=e=>{DISP.calm=e.target.checked;applyDisp()};$('optSpeak').onchange=e=>{DISP.speak=e.target.checked;applyDisp()};
function placeDisp(){const pop=$('dispPop'),r=$('dispBtn').getBoundingClientRect(),w=pop.offsetWidth||300;pop.style.top=(r.bottom+6)+'px';pop.style.left=Math.max(16,Math.min(r.right-w,innerWidth-16-w))+'px'}
$('dispBtn').onclick=()=>{const o=$('dispPop').hidden;$('dispPop').hidden=!o;$('dispBtn').setAttribute('aria-expanded',o);if(o)placeDisp()};
addEventListener('resize',()=>{if(!$('dispPop').hidden)placeDisp()});addEventListener('scroll',()=>{if(!$('dispPop').hidden){$('dispPop').hidden=true;$('dispBtn').setAttribute('aria-expanded',false)}},{passive:true});

const starRow=n=>`<p class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>`<span class="${i<=n?'on':''}">★</span>`).join('')}</p>`;
const streakPill=n=>n>=2?`<span class="streak bump" aria-live="polite">★ ${n} in a row</span>`:'';
function celebrateWin(){FX.shower();FX.play('win')}

/* ---------- Match & Memory ---------- */
const meanOf=c=>c.senses.map(x=>x.mean).join('; ');
function pickPairs(n,key){
  const seen=new Set(),out=[];
  const p=pool();for(let t=0;t<p.length&&out.length<n;t++){const c=draw(key,p,1)[0];const m=meanOf(c);if(seen.has(m)||seen.has(c.main))continue;seen.add(m);seen.add(c.main);out.push(c)}
  return out;
}
const emptyMsg=`<div class="empty" style="border:0"><h2>Not enough cards</h2><p class="note">Ask your teacher to choose at least 2 cards, or pick more weeks to study.</p></div>`;
let M=null;
function newMatch(){
  const cs=pickPairs(6,'match');if(cs.length<2){$('mcard').innerHTML=emptyMsg;return}
  M={cs,left:shuf(cs),right:shuf(cs),done:new Set(),sel:null,miss:0,t0:Date.now(),wrong:null,streak:0,best:0};renderMatch();
}
function renderMatch(){
  const fin=M.done.size===M.cs.length;
  const secs=Math.round(((M.t1||Date.now())-M.t0)/1000);
  $('mcard').innerHTML=`<div class="gtop"><b>Match each word part to its meaning</b><span class="grp">${fin?'':streakPill(M.streak)}<span class="note">${M.done.size} of ${M.cs.length} matched · ${M.miss} miss${M.miss===1?'':'es'}</span></span></div>
   ${fin?`<div class="winbox">${starRow(M.miss===0?3:M.miss<=2?2:1)}<p class="whole" style="font-size:1.3rem;margin:0"><b>${M.miss===0?'Perfect match!':'All matched!'}</b> ${secs} second${secs===1?'':'s'}, ${M.miss} miss${M.miss===1?'':'es'}${M.best>=3?`, best streak ${M.best}`:''}.</p>
     <div class="controls" style="justify-content:center"><button class="btn primary" id="mAgain">Play again</button></div></div>`:''}
   <div class="mcols"><div class="mcol">${M.left.map(c=>`<button class="mbtn part c-${c.kind} ${M.done.has(c.id)?'done':''} ${M.sel===c.id?'sel':''}" data-l="${c.id}" ${M.done.has(c.id)?'disabled':''}>${esc(c.main)}</button>`).join('')}</div>
   <div class="mcol">${M.right.map(c=>`<button class="mbtn ${M.done.has(c.id)?'ok done':''}" data-r="${c.id}" ${M.done.has(c.id)?'disabled':''}>${esc(meanOf(c))}</button>`).join('')}</div></div>
   ${fin?'':`<p class="note" style="margin:0;text-align:center">Tap a word part, then tap its meaning.</p>`}`;
  $('mcard').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{M.sel=b.dataset.l;renderMatch()});
  $('mcard').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    if(!M.sel){const l=$('mcard').querySelector('.mcol');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');return}
    if(b.dataset.r===M.sel){const id=M.sel,lr=$('mcard').querySelector(`[data-l="${id}"]`).getBoundingClientRect(),rr=b.getBoundingClientRect();
      M.done.add(id);M.sel=null;M.streak++;M.best=Math.max(M.best,M.streak);const fin=M.done.size===M.cs.length;if(fin)M.t1=Date.now();
      renderMatch();FX.burst(lr,18);FX.burst(rr,26);FX.cheer(rr,FX.praise(M.streak));FX.play('good',M.streak);
      ['l','r'].forEach(k=>{const e=$('mcard').querySelector(`[data-${k}="${id}"]`);if(e)e.classList.add('popin')});
      if(fin){rec(d=>{const o=sub(d,'match');bump(o,'r');bump(o,'miss',M.miss);bump(o,'sec',Math.round((M.t1-M.t0)/1000));o.fast=Math.min(o.fast||99999,Math.round((M.t1-M.t0)/1000));if(M.miss===0)bump(o,'perfect');o.best=Math.max(o.best||0,M.best);M.cs.forEach(c=>bump(sub(d,'right'),c.id))});setTimeout(celebrateWin,350)}}
    else{M.miss++;M.streak=0;rec(d=>missCard(d,M.sel));FX.play('bad');renderMatch();const r=$('mcard').querySelector(`[data-r="${b.dataset.r}"]`);r.classList.add('shake');}
  });
  if(fin)$('mAgain').onclick=newMatch;
}
let G=null;
function newMemory(){
  const cs=pickPairs(6,'memory');if(cs.length<2){$('memcard').innerHTML=emptyMsg;return}
  const tiles=shuf(cs.flatMap(c=>[{c,part:true},{c,part:false}]));
  G={cs,tiles,up:[],got:new Set(),moves:0,lock:false,streak:0,best:0};renderMemory();
}
function renderMemory(){
  const fin=G.got.size===G.cs.length;
  $('memcard').innerHTML=`<div class="gtop"><b>Find each word part and its meaning</b><span class="grp">${fin?'':streakPill(G.streak)}<span class="note">${G.got.size} of ${G.cs.length} pairs · ${G.moves} turn${G.moves===1?'':'s'}</span></span></div>
    ${fin?`<div class="winbox">${starRow(G.moves<=G.cs.length+3?3:G.moves<=G.cs.length*2?2:1)}<p class="whole" style="font-size:1.3rem;margin:0"><b>You found them all</b> in ${G.moves} turns!${G.best>=3?` Best streak: ${G.best} pairs in a row.`:''}</p><div class="controls" style="justify-content:center"><button class="btn primary" id="gAgain">Play again</button></div></div>`:''}
    <div class="mgrid">${G.tiles.map((t,i)=>{const open=G.up.includes(i)||G.got.has(t.c.id);
      return`<button class="tile2 ${open?'up':'back'} ${open&&t.part?'part c-'+t.c.kind:''} ${G.got.has(t.c.id)?'got':''}" data-i="${i}" aria-label="${open?esc(t.part?t.c.main:meanOf(t.c)):'Hidden tile'}" ${G.got.has(t.c.id)?'disabled':''}>${open?esc(t.part?t.c.main:meanOf(t.c)):''}</button>`}).join('')}</div>`;
  $('memcard').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(G.lock||G.up.includes(i))return;
    G.up.push(i);
    if(G.up.length===2){G.moves++;const [a,b2]=G.up.map(k=>G.tiles[k]);
      if(a.c===b2.c&&a.part!==b2.part){const ks=G.up.slice(),rs=ks.map(k=>$('memcard').querySelector(`[data-i="${k}"]`).getBoundingClientRect());
        G.got.add(a.c.id);G.up=[];G.streak++;G.best=Math.max(G.best,G.streak);const fin=G.got.size===G.cs.length;renderMemory();
        rs.forEach(r=>FX.burst(r,22));FX.cheer(rs[1],FX.praise(G.streak));FX.play('good',G.streak);
        ks.forEach(k=>{const e=$('memcard').querySelector(`[data-i="${k}"]`);if(e)e.classList.add('popin')});
        if(fin){rec(d=>{const o=sub(d,'mem');bump(o,'r');bump(o,'turns',G.moves);o.fewest=Math.min(o.fewest||999,G.moves);o.best=Math.max(o.best||0,G.best)});setTimeout(celebrateWin,350)}}
      else{G.lock=true;G.streak=0;renderMemory();setTimeout(()=>{FX.play('bad')},250);setTimeout(()=>{G.up=[];G.lock=false;renderMemory()},1100)}}
    else{FX.play('flip');renderMemory()}
  });
  if(fin)$('gAgain').onclick=newMemory;
}

MRAW.trim().split("\n").forEach(l=>{const i=l.indexOf('|');if(i<0)return;const w=l.slice(0,i);
  MORPH[w]=l.slice(i+1).split(';').map(t=>{const [seg,kind,mean,card]=t.split('~');return{seg,kind,mean,card:card&&card!=='-'?(card.split(',').map(k=>BYID[k.trim()]).find(Boolean)||null):null}})});
function partsRow(word){
  const ps=MORPH[(word||'').toLowerCase()];if(!ps||ps.length<2)return'';
  const shown=ps.filter(p=>p.kind!=='connector'&&p.kind!=='silent');
  const cls=p=>p.card?'c-'+p.card.kind:p.kind==='prefix'?'c-prefix':p.kind==='suffix'?'c-suffix':'c-free';
  const lab=p=>p.kind==='prefix'?p.seg+'-':p.kind==='suffix'?'-'+p.seg:p.seg;
  const tag=p=>p.card?KIND[p.card.kind]:p.kind==='word'?'Base word':p.kind==='base'?'Root':p.kind==='prefix'?'Prefix':'Suffix';
  const extra=ps.filter(p=>p.kind==='connector'||p.kind==='silent').map(p=>p.kind==='silent'?'silent e':'connecting “'+esc(p.seg)+'”');
  return`<div class="wparts" aria-label="Word parts">${sayBtn(`${word}. ${shown.map(p=>p.seg+", "+p.mean).join(". ")}.`,"Listen to the word parts")}${shown.map(p=>`<span class="wp ${cls(p)} ${p.kind==='word'?'isword':''}"><small class="wt">${tag(p)}</small><b>${esc(lab(p))}</b><small>${esc(p.mean)}</small></span>`).join('<span class="wplus">+</span>')}</div>${extra.length?`<p class="note" style="margin:2px 0 0;font-size:.85rem">Also: ${extra.join(', ')}.</p>`:''}`;
}

const ctxWordsFor=c=>{const seen=new Set();return CTX.filter(x=>x.c===c&&!seen.has(x.w)&&seen.add(x.w))};
function cardStatsAll(){const days=HIST.days,keys=Object.keys(days).sort(),st={};
  keys.forEach((k,i)=>{const d=days[k];for(const id in d.right||{}){const o=st[id]=st[id]||{r:0,m:0,last:k};o.r+=d.right[id];o.last=k}
    for(const id in d.miss||{}){const o=st[id]=st[id]||{r:0,m:0,last:k};o.m+=d.miss[id];o.last=k}});return st}
const daysSince=k=>{if(!k)return 99;const [y,m,d]=k.split('-').map(Number);return Math.round((new Date()-new Date(y,m-1,d))/864e5)};

/* ---------- Daily review: weak cards + cards not seen lately ---------- */
function reviewPick(n=10){const st=cardStatsAll(),p=pool();
  const scored=p.map(c=>{const o=st[c.id];const t=o?o.r+o.m:0,acc=t?o.r/t:0;
    const score=(t?(1-acc)*3:1.1)+Math.min(daysSince(o&&o.last),14)/7+(t?0:.3)+Math.random()*.25;return{c,score,t,acc}});
  return scored.sort((a,b)=>b.score-a.score).slice(0,Math.min(n,p.length))}

/* ---------- Word sort: put each word under its word part ---------- */
let WS=null;
function newSort(){
  const p=pool();const formsOf=c=>c.forms;
  const ok=c=>ctxWordsFor(c).length>=3;
  let cands=draw('sort',p.filter(ok),Math.min(12,p.filter(ok).length));const chosen=[];
  for(const c of cands){if(chosen.length>=3)break;if(chosen.some(o=>overlap(o,c)||o.main===c.main||o.forms.some(f=>c.forms.includes(f))))continue;chosen.push(c)}
  if(chosen.length<2){for(const c of shuf(BANK.filter(ok))){if(chosen.length>=3)break;if(chosen.includes(c)||chosen.some(o=>overlap(o,c)||o.forms.some(f=>c.forms.includes(f))))continue;chosen.push(c)}}
  const tiles=[];

/* Badge pictures: an emoji plus an optional little number tag */
const BEMO={name:['👋'],first:['🔍'],run3:['🔥','3'],run5:['🔥','5'],run10:['🚀','10'],days10:['📅','10'],days30:['🗓️','30'],min60:['⏰','60m'],
  ans100:['💪','100'],ans500:['🤖','500'],quiz10:['💯'],quizr10:['📝','10'],check1:['✅'],grow3:['📈','+3'],
  ctx1:['🧩'],lv3:['🔎','L3'],lv4:['🧠','L4'],lv5:['🕵️','L5'],lv6:['🎩','L6'],ctx10:['🌟'],
  mperf:['🎯'],mfast:['⚡','30s'],mstreak:['🎉','6'],mem:['🐘'],mem10:['🃏','10'],build10:['🧱','10'],build50:['🏗️','50'],
  spell10:['🐝'],spellp:['🏅'],sortp:['📦'],speed15:['🏃','15'],speed25:['🌩️','25'],
  cards50:['🗂️','50'],cards150:['📚','150'],mast10:['🌱','10'],mast50:['🌳','50'],mast100:['👑','100'],week:['🎁'],rev5:['☀️','5'],
  pre:['🌸','pre-'],suf:['⭐','-suf'],lat:['🏛️','Latin'],grk:['🏺','Greek']};
function medal(b,on,small){const sh=BSHAPE[b.cat]||BSHAPE.quiz,cy=b.cat==='start'?33:30,[emo,tag]=BEMO[b.id]||[b.sym],hasTag=tag&&!small,ey=hasTag?cy-4:cy+1,tw=tag?Math.max(16,[...tag].length*6.2+8):0;
  const inner=`<g transform="translate(32 ${cy}) scale(.76) translate(-32 -${cy})">${sh} class="bring"/></g>`;
  const rib=on&&!small?`<path class="brib" d="M21 40 14 62l7-4 4 5 6-19z"/><path class="brib" d="M43 40l7 22-7-4-4 5-6-19z"/>`:'';
  const lock=on||small?'':`<g class="block"><circle cx="53" cy="12" r="9"/><rect x="48.8" y="11.2" width="8.4" height="6.4" rx="1.4"/><path d="M50.7 11.2V9a2.3 2.3 0 0 1 4.6 0v2.2"/></g>`;
  const glint=on?`<ellipse class="bglint" cx="24" cy="${cy-12}" rx="8" ry="3.5" transform="rotate(-35 24 ${cy-12})"/>`:'';
  return`<span class="medal m-${b.cat} ${on?'on':''} ${small?'sm':''}" aria-hidden="true"><svg viewBox="0 0 64 66">${rib}${on?`<g transform="translate(0 2.5)">${sh} class="bshadow"/></g>`:''}${sh} class="bs" ${on?`style="fill:url(#bg-${b.cat})"`:''}/>${inner}${glint}<text x="32" y="${ey}" class="be" font-size="${small?30:hasTag?22:26}">${emo}</text>${hasTag?`<g class="btag"><rect x="${32-tw/2}" y="${cy+8.5}" width="${tw}" height="12" rx="6"/><text x="32" y="${cy+14.8}">${esc(tag)}</text></g>`:''}${lock}</svg></span>`}
function badgesHTML(days,name,compact){
  const {v,ids}=earnedBadges(days,name);const got=new Set(ids);
  if(compact)return ids.length?`<div class="bmini">${BADGES.filter(b=>got.has(b.id)).map(b=>`<span class="bchip" title="${esc(b.desc)}">${medal(b,true,true)}${esc(b.name)}</span>`).join('')}</div>`:'<p class="note">No badges yet.</p>';
  const cats=[...new Set(BADGES.map(b=>b.cat))];
  return`<section class="sblock"><div class="gtop"><p class="plabel" style="margin:0">Badges</p><span class="note"><b>${ids.length}</b> of ${BADGES.length} earned</span></div>
    ${cats.map(c=>`<p class="bcat">${BCAT[c]}</p><div class="bgrid">${BADGES.filter(b=>b.cat===c).map(b=>{const on=got.has(b.id),val=b.val(v);
      const prog=on?'Earned':b.hint?b.hint(v):b.best?(val?`Best so far: ${val}`:'Not yet'):`${Math.min(val,b.n)} / ${b.n}`;
      const p=on?100:b.best?Math.round(100*Math.min(val,b.n)/b.n):Math.round(100*Math.min(val,b.n)/b.n);
      return`<div class="badge ${on?'on':''}" title="${esc(b.desc)}">${medal(b,on)}<b>${esc(b.name)}</b><small>${esc(b.desc)}</small>${on?'<em>Earned!</em>':`<div class="bprog"><i style="width:${p}%"></i></div><small class="bp">${esc(prog)}</small>`}</div>`}).join('')}</div>`).join('')}
  </section>`;
}
/* unlock detection */
let BSEEN=new Set(store.get('rd-badges-seen',null)||[]);
if(!store.get('rd-badges-init',false)){earnedBadges(HIST.days,HIST.name).ids.forEach(i=>BSEEN.add(i));store.set('rd-badges-seen',[...BSEEN]);store.set('rd-badges-init',true)}
let badgeTimer=null,badgeQueue=[],badgeShowing=false;
function checkBadges(){clearTimeout(badgeTimer);badgeTimer=setTimeout(()=>{
  const {ids}=earnedBadges(HIST.days,HIST.name);const fresh=ids.filter(i=>!BSEEN.has(i));if(!fresh.length)return;
  fresh.forEach(i=>BSEEN.add(i));store.set('rd-badges-seen',[...BSEEN]);badgeQueue.push(...fresh);showNextBadge()},900)}
function showNextBadge(){if(badgeShowing||!badgeQueue.length)return;badgeShowing=true;
  const b=BADGES.find(x=>x.id===badgeQueue.shift());if(!b){badgeShowing=false;return}const t=$('badgeToast');
  t.innerHTML=`${medal(b,true)}<div><small>New badge!</small><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div><button class="btn small" id="badgeSee">See badges</button>`;
  t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');
  FX.shower();FX.play('win');
  $('badgeSee').onclick=()=>{t.hidden=true;badgeShowing=false;badgeQueue=[];progView='me';setMode('progress')};
  setTimeout(()=>{t.hidden=true;badgeShowing=false;showNextBadge()},4200)}

let meRange='7';
function meHTML(){
  const sync=syncState==='synced'?'Saved for your teacher.':shared?'Saved on this device. Your teacher can\'t see it yet. Ask your teacher for Contributor access, or copy your report below.':'Saved on this device.';

}

function classHTML(){
  const ranges=[['today','Today'],['yesterday','Yesterday'],['7','Last 7 days'],['30','Last 30 days'],['all','All time']];
  const rows=CLASS.map(s=>({s,t:sumDays(s.days||{},rangeKeys(s.days||{},classRange)),last:Object.keys(s.days||{}).sort().pop()}))
    .sort((a,b)=>(b.last||'').localeCompare(a.last||'','en')||(a.s.name||'').localeCompare(b.s.name||'','en'));
  const active=rows.filter(r=>r.t.act).length;
  return`<div class="pcard">
    <div class="gtop"><b>Class progress</b><span class="grp"><button class="btn small" id="csvBtn" ${CLASS.length?'':'disabled'}>Download spreadsheet</button><span class="note" id="csvMsg"></span></span><label class="note">Show <select id="crange">${ranges.map(([v,l])=>`<option value="${v}" ${v===classRange?'selected':''}>${l}</option>`).join('')}</select></label></div>
    ${!CLASS.length?`<p class="note">No student records yet. Records appear here when students who are signed in to Claude, with Contributor access to this page, practice. Students with view-only access keep their history on their own device and can copy a report to send you.</p>`:
    `<p class="note" style="margin:0">${active} of ${rows.length} students practiced in this period. Tap a name to see each day.</p>
    <div class="tablewrap"><table class="ctable"><thead><tr><th>Student</th><th>Last active</th><th>Days</th><th>Minutes</th><th>Quiz</th><th>Context clues</th><th>Games</th><th>Most missed</th><th>Badges</th></tr></thead><tbody>
    ${rows.map(({s,t,last})=>`<tr class="${t.act?'':'idle'}" data-st="${esc(s.id)}"><td><button class="linkish" data-st="${esc(s.id)}">${esc(s.name||'(no name)')}</button></td><td>${last?fmtDay(last):'–'}</td><td>${t.act}</td><td>${Math.round(t.min)}</td>
      <td>${t.q.t?`${pct(t.q.c,t.q.t)} <small>(${t.q.t})</small>`:'–'}</td><td>${t.x.t?`${pct(t.x.c,t.x.t)} <small>(${t.x.t}, to L${t.x.top})</small>`:'–'}</td>
      <td>${t.m+t.g+t.b?`${t.m} match · ${t.g} memory · ${t.b} built`:'–'}</td><td>${topMissed(t.miss,3).map(([id])=>esc(BYID[id].main)).join(', ')||'–'}</td><td>${earnedBadges(s.days||{},s.name).ids.length}</td></tr>
      ${openStudent===s.id?`<tr class="detail"><td colspan="9"><div class="sheet"><p class="plabel" style="margin:0">Badges earned</p>${badgesHTML(s.days||{},s.name,true)}${statsHTML(s.days||{},classRange)}</div></td></tr>`:''}`).join('')}
    </tbody></table></div>`}
    <textarea id="csvText" class="reporttext" readonly hidden></textarea>
    ${reportsHTML()}
  </div>`;
}
function reportText(){const ks=Object.keys(HIST.days).sort().reverse().slice(0,14);
  return`Root Detective progress for ${HIST.name||'(no name)'}\n`+ks.map(k=>`${fmtDay(k)} (${Math.round(HIST.days[k].min||0)} min): ${dayLine(k,HIST.days[k])}`).join('\n')}
function wireProgress(){
  const pn=$('pnameSave');if(pn)pn.onclick=()=>{setName($('pname').value);renderProgress()};
  const pi=$('pname');if(pi)pi.onkeydown=e=>{if(e.key==='Enter'){setName(pi.value);renderProgress()}};
  const sm=$('studyMissedAll');if(sm)sm.onclick=()=>{const ids=topMissed(sumDays(HIST.days,Object.keys(HIST.days)).miss,10).map(([id])=>BYID[id]);setMode('cards',true);deck=ids;idx=0;renderCard()};
  const cr=$('copyReport');if(cr)cr.onclick=()=>{const t=reportText();const ta=$('reportText');
    const fallback=()=>{ta.hidden=false;ta.value=t;ta.focus();ta.select();$('copyMsg').textContent='Select all and copy this text.'};
    try{navigator.clipboard.writeText(t).then(()=>{$('copyMsg').textContent='Copied! Paste it in a message to your teacher.'},fallback)}catch(e){fallback()}};
  const mr=$('mrange');if(mr)mr.onchange=()=>{meRange=mr.value;renderProgress()};
  const sw=$('studyWeak');if(sw)sw.onclick=()=>{const A=aggStats(HIST.days,rangeKeys(HIST.days,meRange));const ids=Object.keys(A.card).filter(id=>A.card[id].t>=2&&A.card[id].acc<.7).sort((x,y)=>A.card[x].acc-A.card[y].acc).slice(0,10).map(id=>BYID[id]);if(ids.length){setMode('cards',true);deck=ids;idx=0;renderCard()}};
  const cb=$('csvBtn');if(cb)cb.onclick=downloadCSV;
  const rg=$('crange');if(rg)rg.onchange=()=>{classRange=rg.value;renderProgress()};
  $('progBody').querySelectorAll('button[data-st]').forEach(b=>b.onclick=()=>{openStudent=openStudent===b.dataset.st?null:b.dataset.st;renderProgress()});
}
function watchClass(){
  if(classUnsub||!DBH)return;
  classUnsub=DBH.collection('progress').onSnapshot(snap=>{
    const docs=snap.docs||[];CLASS=docs.map(d=>({id:d.id,...(d.data()||{})})).filter(x=>x.id!==MYUID);if(mode==='progress'&&progView==='class')renderProgress()},
    ()=>{classUnsub=null});
}
async function initProgressSync(db,user){
  DBH=db;if(!db||!user)return;
  let uid=null;try{uid=await user.id()}catch(e){}
  if(!uid)return;MYUID=uid;
  const ref=db.doc('progress/'+uid);
  try{const s=await ref.get();if(s.exists){const d=s.data()||{};HIST.days=mergeDays(d.days||{},HIST.days);if(Array.isArray(d.reports)){const ats=new Set((HIST.reports||[]).map(r=>r.at));HIST.reports=(HIST.reports||[]).concat(d.reports.filter(r=>!ats.has(r.at))).sort((a,b)=>(a.at||'').localeCompare(b.at||'')).slice(-100)}if(!HIST.name&&d.name){HIST.name=d.name;store.set('rd-name',HIST.name)}saveLocal()}}catch(e){}
  progRef=ref;
  if(Object.keys(HIST.days).length||HIST.name)pushRemote();
  renderNameBar();if(mode==='progress')renderProgress();
}
